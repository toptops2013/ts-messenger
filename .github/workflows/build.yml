          cat > app/src/main/java/com/topsstudio/messenger/PushService.java <<'TSEOF'
          package com.topsstudio.messenger;

          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;

          import org.json.JSONObject;

          import okhttp3.Request;
          import okhttp3.Response;
          import okhttp3.WebSocket;
          import okhttp3.WebSocketListener;

          /**
           * Фоновое подключение к серверу: уведомления о сообщениях и звонках, когда приложение закрыто.
           * Сервер шлёт сюда только короткие события "n" и не считает вас «в сети».
           */
          public class PushService extends Service {
              static volatile boolean running;

              private final Handler h = new Handler(Looper.getMainLooper());
              private WebSocket ws;
              private long backoff = 2000;
              private boolean stopped;
              private int gen;                              // номер подключения — старые события игнорируем
              private ConnectivityManager.NetworkCallback netCb;

              static boolean shouldRun(Context c) {
                  return Prefs.enabled(c) && Prefs.background(c) && Prefs.loggedIn(c) && Notifier.enabled(c);
              }

              static void startIfNeeded(Context c) {
                  if (!shouldRun(c)) { stop(c); return; }
                  Intent i = new Intent(c, PushService.class);
                  try {
                      if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(i); else c.startService(i);
                  } catch (Exception ignored) {
                      // Android может запретить запуск из фона — запустится при следующем открытии приложения
                  }
              }

              static void stop(Context c) {
                  c.stopService(new Intent(c, PushService.class));
              }

              /** Переподключиться сейчас (например, появилась сеть или вошли в аккаунт). */
              static void kick(Context c) {
                  if (running) {
                      Intent i = new Intent(c, PushService.class).setAction("reconnect");
                      try { c.startService(i); } catch (Exception ignored) { }
                  } else startIfNeeded(c);
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  Notifier.channels(this);
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(Notifier.ID_BG, Notifier.background(this), ServiceInfo.FOREGROUND_SERVICE_TYPE_REMOTE_MESSAGING);
                  } else {
                      startForeground(Notifier.ID_BG, Notifier.background(this));
                  }
                  running = true;
                  ConnectivityManager cm = (ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE);
                  netCb = new ConnectivityManager.NetworkCallback() {
                      @Override public void onAvailable(Network n) { h.post(() -> { backoff = 2000; reconnect(); }); }
                  };
                  try { cm.registerDefaultNetworkCallback(netCb); } catch (Exception ignored) { }
                  connect();
                  h.postDelayed(ping, 25000);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (!shouldRun(this)) { stopSelf(); return START_NOT_STICKY; }
                  if (intent != null && "reconnect".equals(intent.getAction())) { backoff = 2000; reconnect(); }
                  return START_STICKY;
              }

              private final Runnable ping = new Runnable() {
                  @Override public void run() {
                      if (ws != null) ws.send("{\"t\":\"ping\"}");
                      h.postDelayed(this, 25000);
                  }
              };

              private void reconnect() {
                  if (stopped) return;
                  h.removeCallbacks(retry);
                  if (ws != null) { ws.cancel(); ws = null; }
                  connect();
              }

              private final Runnable retry = this::connect;

              private void schedule() {
                  if (stopped) return;
                  h.removeCallbacks(retry);
                  h.postDelayed(retry, backoff);
                  backoff = Math.min(backoff * 2, 60000);
              }

              private void connect() {
                  if (stopped || ws != null) return;
                  String cookie = Net.cookie();
                  if (cookie == null || !cookie.contains("msid=")) { Prefs.setLoggedIn(this, false); stopSelf(); return; }
                  String url = Net.SITE.replaceFirst("^http", "ws") + "/ws?push=1";
                  Request r = new Request.Builder().url(url)
                          .header("Cookie", cookie)
                          .header("Origin", Net.SITE)
                          .header("User-Agent", Net.UA)
                          .build();
                  final int my = ++gen;
                  ws = Net.http().newWebSocket(r, new WebSocketListener() {
                      @Override public void onOpen(WebSocket s, Response resp) { h.post(() -> { if (my == gen) backoff = 2000; }); }

                      @Override public void onMessage(WebSocket s, String text) {
                          if (my != gen) return;
                          try { handle(new JSONObject(text)); } catch (Exception ignored) { }
                      }

                      @Override public void onClosing(WebSocket s, int code, String reason) { s.close(1000, null); }

                      @Override public void onClosed(WebSocket s, int code, String reason) { h.post(() -> dropped(my, code)); }

                      @Override public void onFailure(WebSocket s, Throwable t, Response resp) {
                          int code = resp != null ? resp.code() : 0;
                          h.post(() -> dropped(my, code == 403 ? 4003 : 0));
                      }
                  });
              }

              private void dropped(int my, int code) {
                  if (my != gen) return;
                  ws = null;
                  if (code == 4001) {                       // вышли из аккаунта или сессия истекла
                      Prefs.setLoggedIn(this, false);
                      stopSelf();
                      return;
                  }
                  schedule();
              }

              private void handle(JSONObject d) {
                  if (!"n".equals(d.optString("t"))) return;
                  String kind = d.optString("kind");
                  boolean front = MainActivity.visible;
                  switch (kind) {
                      case "msg":
                          if (!front) Notifier.message(this, d);
                          break;
                      case "del":
                          Notifier.removeMessage(this, d.optInt("chat"), d.optLong("id"));
                          break;
                      case "read":
                          Notifier.cancelChat(this, d.optInt("chat"));
                          break;
                      case "call":
                          if (!front) Notifier.call(this, d);
                          break;
                      case "call_end":
                          Notifier.callEnd(this, d.optString("call"));
                          break;
                      default:
                  }
              }

              @Override
              public void onDestroy() {
                  stopped = true;
                  running = false;
                  h.removeCallbacksAndMessages(null);
                  if (ws != null) ws.close(1000, null);
                  try {
                      ConnectivityManager cm = (ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE);
                      if (netCb != null) cm.unregisterNetworkCallback(netCb);
                  } catch (Exception ignored) { }
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
