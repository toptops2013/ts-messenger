          TSEOF
          mkdir -p "$(dirname "app/src/main/res/values-v29/styles.xml")"
          cat > app/src/main/res/values-v29/styles.xml <<'TSEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- светлая тема телефона: сайт внутри тоже светлый (prefers-color-scheme) -->
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@color/splash</item>
                  <item name="android:statusBarColor">@color/bg</item>
