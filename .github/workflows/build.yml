          TSEOF
          mkdir -p "$(dirname "app/src/main/res/values-night-v29/styles.xml")"
          cat > app/src/main/res/values-night-v29/styles.xml <<'TSEOF'
          <?xml version="1.0" encoding="utf-8"?>
