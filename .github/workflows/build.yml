          cat > app/src/main/java/com/topsstudio/messenger/Notifier.java <<'TSEOF'
          package com.topsstudio.messenger;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.RemoteInput;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;

          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.Iterator;
          import java.util.List;
          import java.util.Map;

          /** Все уведомления приложения: сообщения (с ответом прямо из шторки), звонки, фоновое подключение. */
          final class Notifier {
              private Notifier() { }

              static final String CH_MSG = "messages";
              static final String CH_CALL = "calls";
              static final String CH_BG = "background";
              static final String CH_UPD = "updates";
              static final String GROUP = "ts_messages";
              static final int ID_BG = 1;
              static final int ID_SUMMARY = 2;
              static final int ID_UPDATE = 3;
              static final int ACCENT = 0xFF7C8CFF;

              /** Последние сообщения по чатам — чтобы в уведомлении была переписка, а не одна строка. */
              private static final class Line {
                  final long id; final String sender; final String text; final long ts;
                  Line(long id, String sender, String text, long ts) { this.id = id; this.sender = sender; this.text = text; this.ts = ts; }
              }
              private static final class ChatN {
                  String title; boolean group; long lastId; final List<Line> lines = new ArrayList<>();
              }
              private static final Map<Integer, ChatN> chats = new HashMap<>();

              static NotificationManager nm(Context c) {
                  return (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
              }

              static void channels(Context c) {
                  if (Build.VERSION.SDK_INT < 26) return;
                  NotificationManager m = nm(c);
                  NotificationChannel msg = new NotificationChannel(CH_MSG, "Сообщения", NotificationManager.IMPORTANCE_HIGH);
                  msg.setDescription("Новые сообщения в чатах");
                  msg.enableLights(true);
                  msg.setLightColor(ACCENT);
                  msg.enableVibration(true);
                  msg.setShowBadge(true);
                  m.createNotificationChannel(msg);

                  NotificationChannel call = new NotificationChannel(CH_CALL, "Звонки", NotificationManager.IMPORTANCE_HIGH);
                  call.setDescription("Входящие звонки");
                  Uri ring = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE);
                  call.setSound(ring, new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build());
                  call.enableVibration(true);
                  call.setVibrationPattern(new long[]{0, 800, 600, 800, 600, 800});
                  call.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                  m.createNotificationChannel(call);

                  NotificationChannel bg = new NotificationChannel(CH_BG, "Фоновое подключение", NotificationManager.IMPORTANCE_MIN);
                  bg.setDescription("Нужно, чтобы сообщения приходили, когда приложение закрыто. Это уведомление можно скрыть.");
                  bg.setShowBadge(false);
                  m.createNotificationChannel(bg);

                  NotificationChannel upd = new NotificationChannel(CH_UPD, "Обновления", NotificationManager.IMPORTANCE_DEFAULT);
                  upd.setDescription("Новые версии приложения");
                  m.createNotificationChannel(upd);
              }

              @SuppressWarnings("deprecation")
              static Notification.Builder builder(Context c, String channel) {
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(c, channel) : new Notification.Builder(c);
                  b.setSmallIcon(R.drawable.ic_stat).setColor(ACCENT);
                  if (Build.VERSION.SDK_INT < 26) {
                      b.setPriority(CH_BG.equals(channel) ? Notification.PRIORITY_MIN : Notification.PRIORITY_HIGH);
                      if (CH_MSG.equals(channel)) b.setDefaults(Notification.DEFAULT_ALL);
                  }
                  return b;
              }

              static int piFlags(boolean mutable) {
                  int f = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= 31) f |= mutable ? PendingIntent.FLAG_MUTABLE : PendingIntent.FLAG_IMMUTABLE;
                  else if (Build.VERSION.SDK_INT >= 23 && !mutable) f |= PendingIntent.FLAG_IMMUTABLE;
                  return f;
              }

              static PendingIntent openApp(Context c, int chat, String call) {
                  Intent i = new Intent(c, MainActivity.class)
                          .setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  if (chat > 0) i.putExtra("chat", chat);
                  if (call != null) i.putExtra("call", call);
                  return PendingIntent.getActivity(c, (call != null ? 500000 : 0) + chat, i, piFlags(false));
              }

              /* ---------------- сообщения ---------------- */

              /** n: {chat, id, ts, title, sender, text, group} — с сервера (фоновое подключение). */
              @SuppressWarnings("deprecation")
              static synchronized void message(Context c, JSONObject n) {
                  if (!Prefs.enabled(c)) return;
                  int chat = n.optInt("chat");
                  if (chat <= 0) return;
                  ChatN cn = chats.get(chat);
                  if (cn == null) { cn = new ChatN(); chats.put(chat, cn); }
                  cn.title = n.optString("title", "Сообщение");
                  cn.group = n.optBoolean("group");
                  long id = n.optLong("id");
                  cn.lastId = Math.max(cn.lastId, id);
                  String text = Prefs.showText(c) ? n.optString("text", "") : "Новое сообщение";
                  String sender = n.optString("sender", "");
                  cn.lines.add(new Line(id, sender.isEmpty() ? cn.title : sender, text, n.optLong("ts", System.currentTimeMillis() / 1000) * 1000));
                  while (cn.lines.size() > 8) cn.lines.remove(0);
                  post(c, chat, cn, true);
              }

              @SuppressWarnings("deprecation")
              private static void post(Context c, int chat, ChatN cn, boolean alert) {
                  Notification.MessagingStyle st = new Notification.MessagingStyle("Вы");
                  if (cn.group) st.setConversationTitle(cn.title);
                  if (Build.VERSION.SDK_INT >= 28) st.setGroupConversation(cn.group);
                  for (Line l : cn.lines) st.addMessage(l.text, l.ts, l.sender);
                  Line last = cn.lines.isEmpty() ? null : cn.lines.get(cn.lines.size() - 1);

                  Notification.Builder b = builder(c, CH_MSG)
                          .setStyle(st)
                          .setContentTitle(cn.title)
                          .setContentText(last != null ? last.text : "")
                          .setAutoCancel(true)
                          .setOnlyAlertOnce(!alert)
                          .setCategory(Notification.CATEGORY_MESSAGE)
                          .setGroup(GROUP)
                          .setNumber(cn.lines.size())
                          .setShowWhen(true)
                          .setWhen(last != null ? last.ts : System.currentTimeMillis())
                          .setContentIntent(openApp(c, chat, null))
                          .setDeleteIntent(action(c, "dismiss", chat, 0));

                  // «Ответить» прямо из шторки и «Прочитано»
                  RemoteInput ri = new RemoteInput.Builder(ActionReceiver.KEY_TEXT).setLabel("Сообщение…").build();
                  Notification.Action reply = new Notification.Action.Builder(
                          android.graphics.drawable.Icon.createWithResource(c, R.drawable.ic_stat), "Ответить",
                          actionMutable(c, "reply", chat, cn.lastId)).addRemoteInput(ri).build();
                  Notification.Action read = new Notification.Action.Builder(
                          android.graphics.drawable.Icon.createWithResource(c, R.drawable.ic_stat), "Прочитано",
                          action(c, "read", chat, cn.lastId)).build();
                  b.addAction(reply).addAction(read);

                  nm(c).notify(chatId(chat), b.build());
                  summary(c);
              }

              private static int chatId(int chat) { return 100000 + chat; }

              private static PendingIntent action(Context c, String what, int chat, long msg) {
                  Intent i = new Intent(c, ActionReceiver.class).setAction("ts." + what)
                          .putExtra("chat", chat).putExtra("msg", msg);
                  return PendingIntent.getBroadcast(c, (what.hashCode() & 0xffff) * 31 + chat, i, piFlags(false));
              }

              private static PendingIntent actionMutable(Context c, String what, int chat, long msg) {
                  Intent i = new Intent(c, ActionReceiver.class).setAction("ts." + what)
                          .putExtra("chat", chat).putExtra("msg", msg);
                  return PendingIntent.getBroadcast(c, (what.hashCode() & 0xffff) * 31 + chat, i, piFlags(true));
              }

              /** Общая «папка» уведомлений сообщений (Android группирует их под ней). */
              private static void summary(Context c) {
                  if (chats.isEmpty()) { nm(c).cancel(ID_SUMMARY); return; }
                  int total = 0;
                  for (ChatN cn : chats.values()) total += cn.lines.size();
                  Notification.Builder b = builder(c, CH_MSG)
                          .setContentTitle("TS Messenger")
                          .setContentText(total + " новых сообщений")
                          .setGroup(GROUP).setGroupSummary(true)
                          .setOnlyAlertOnce(true)
                          .setAutoCancel(true)
                          .setContentIntent(openApp(c, 0, null));
                  if (Build.VERSION.SDK_INT >= 26) b.setGroupAlertBehavior(Notification.GROUP_ALERT_CHILDREN);
                  nm(c).notify(ID_SUMMARY, b.build());
              }

              /** Добавить свой ответ в уведомление (после «Ответить» из шторки). */
              static synchronized void addOwnReply(Context c, int chat, String text) {
                  ChatN cn = chats.get(chat);
                  if (cn == null) return;
                  cn.lines.add(new Line(0, "Вы", text, System.currentTimeMillis()));
                  post(c, chat, cn, false);
              }

              /** Сообщение удалили — убираем его из уведомления. */
              static synchronized void removeMessage(Context c, int chat, long id) {
                  ChatN cn = chats.get(chat);
                  if (cn == null) return;
                  for (Iterator<Line> it = cn.lines.iterator(); it.hasNext(); ) if (it.next().id == id) it.remove();
                  if (cn.lines.isEmpty()) cancelChat(c, chat); else post(c, chat, cn, false);
              }

              /** Чат прочитан (здесь или на другом устройстве). */
              static synchronized void cancelChat(Context c, int chat) {
                  chats.remove(chat);
                  nm(c).cancel(chatId(chat));
                  summary(c);
              }

              static synchronized void forget(int chat) { chats.remove(chat); }

              /** Открыли приложение — сообщения больше не висят в шторке. */
              static synchronized void clearMessages(Context c) {
                  for (Integer chat : new ArrayList<>(chats.keySet())) nm(c).cancel(chatId(chat));
                  chats.clear();
                  nm(c).cancel(ID_SUMMARY);
              }

              /** Уведомление от самого сайта (когда фоновое подключение выключено, а приложение свёрнуто). */
              static synchronized void simple(Context c, String title, String body, int chat) {
                  if (!Prefs.enabled(c)) return;
                  JSONObject n = new JSONObject();
                  try {
                      n.put("chat", chat > 0 ? chat : 0).put("title", title).put("text", body)
                              .put("id", System.currentTimeMillis()).put("ts", System.currentTimeMillis() / 1000);
                  } catch (Exception ignored) { }
                  if (chat > 0) { message(c, n); return; }
                  Notification.Builder b = builder(c, CH_MSG).setContentTitle(title).setContentText(body)
                          .setAutoCancel(true).setContentIntent(openApp(c, 0, null));
                  nm(c).notify((int) (System.currentTimeMillis() % 90000) + 10, b.build());
              }

              /* ---------------- звонки ---------------- */

              static int callId(String call) { return 900000 + (call.hashCode() & 0xffff); }

              /** Входящий звонок: экран поверх блокировки, мелодия звонка, «Ответить» / «Отклонить». */
              static void call(Context c, JSONObject n) {
                  if (!Prefs.enabled(c)) return;
                  String call = n.optString("call");
                  int chat = n.optInt("chat");
                  boolean video = n.optBoolean("video");
                  String who = n.optString("title", "Звонок");
                  PendingIntent open = openApp(c, chat, call);
                  Intent dec = new Intent(c, ActionReceiver.class).setAction("ts.decline").putExtra("call", call);
                  PendingIntent decline = PendingIntent.getBroadcast(c, callId(call), dec, piFlags(false));
                  Notification.Builder b = builder(c, CH_CALL)
                          .setContentTitle(who)
                          .setContentText(video ? "Входящий видеозвонок" : (n.optBoolean("group") ? "Звонок в группе · " + n.optString("from") : "Входящий звонок"))
                          .setCategory(Notification.CATEGORY_CALL)
                          .setOngoing(true)
                          .setAutoCancel(true)
                          .setVisibility(Notification.VISIBILITY_PUBLIC)
                          .setContentIntent(open)
                          .setFullScreenIntent(open, true)
                          .addAction(new Notification.Action.Builder(null, "Отклонить", decline).build())
                          .addAction(new Notification.Action.Builder(null, "Ответить", open).build());
                  if (Build.VERSION.SDK_INT >= 26) b.setTimeoutAfter(50000);
                  if (Build.VERSION.SDK_INT < 26) {
                      b.setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE))
                              .setVibrate(new long[]{0, 800, 600, 800});
                  }
                  Notification nt = b.build();
                  nt.flags |= Notification.FLAG_INSISTENT;          // мелодия повторяется, пока не ответят
                  nm(c).notify(callId(call), nt);
              }

              static void callEnd(Context c, String call) {
                  if (call != null && !call.isEmpty()) nm(c).cancel(callId(call));
              }

              /* ---------------- фоновое подключение и обновления ---------------- */

              static Notification background(Context c) {
                  return builder(c, CH_BG)
                          .setContentTitle("TS Messenger")
                          .setContentText("Получаем новые сообщения")
                          .setOngoing(true)
                          .setShowWhen(false)
                          .setContentIntent(openApp(c, 0, null))
                          .build();
              }

              static void updateAvailable(Context c, String version) {
                  Notification.Builder b = builder(c, CH_UPD)
                          .setContentTitle("Доступно обновление")
                          .setContentText("TS Messenger " + version + " — нажмите, чтобы установить")
                          .setAutoCancel(true)
                          .setContentIntent(openApp(c, 0, null));
                  nm(c).notify(ID_UPDATE, b.build());
              }

              static boolean enabled(Context c) {
                  return Build.VERSION.SDK_INT < 24 || nm(c).areNotificationsEnabled();
              }

              @SuppressWarnings("unused")
              static int color() { return Color.parseColor("#7c8cff"); }
          }
