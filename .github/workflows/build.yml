          TSEOF
          mkdir -p "$(dirname "app/src/main/java/com/topsstudio/messenger/ActionReceiver.java")"
          cat > app/src/main/java/com/topsstudio/messenger/ActionReceiver.java <<'TSEOF'
          package com.topsstudio.messenger;

          import android.app.RemoteInput;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;

          import org.json.JSONObject;

          import java.util.UUID;

          /** Кнопки в уведомлениях: «Ответить», «Прочитано», «Отклонить» звонок. Работают без открытия приложения. */
          public class ActionReceiver extends BroadcastReceiver {
              static final String KEY_TEXT = "reply_text";

              @Override
              public void onReceive(Context c, Intent i) {
                  final String a = i.getAction() == null ? "" : i.getAction();
                  final int chat = i.getIntExtra("chat", 0);
                  final long msg = i.getLongExtra("msg", 0);
                  final Context app = c.getApplicationContext();
                  if (a.equals("ts.dismiss")) { Notifier.forget(chat); return; }
                  final PendingResult pr = goAsync();
                  new Thread(() -> {
                      try {
                          if (a.equals("ts.reply")) {
                              Bundle b = RemoteInput.getResultsFromIntent(i);
                              CharSequence t = b != null ? b.getCharSequence(KEY_TEXT) : null;
                              String text = t == null ? "" : t.toString().trim();
                              if (!text.isEmpty() && chat > 0) {
                                  JSONObject j = new JSONObject();
                                  j.put("text", text.length() > 4000 ? text.substring(0, 4000) : text);
                                  j.put("nonce", UUID.randomUUID().toString().replace("-", "").substring(0, 24));
                                  int code = Net.postJson("/api/chats/" + chat + "/messages", j.toString());
                                  if (code == 200) {
                                      Notifier.addOwnReply(app, chat, text);
                                      Net.postJson("/api/chats/" + chat + "/read", "{\"id\":" + Long.MAX_VALUE / 2 + "}");
                                  } else {
                                      Notifier.addOwnReply(app, chat, "⚠ Не отправлено: " + text);
                                  }
                              }
                          } else if (a.equals("ts.read") && chat > 0) {
                              Net.postJson("/api/chats/" + chat + "/read", "{\"id\":" + Math.max(msg, 1) + "}");
                              Notifier.cancelChat(app, chat);
                          } else if (a.equals("ts.decline")) {
                              String call = i.getStringExtra("call");
                              Notifier.callEnd(app, call);
                              if (call != null && call.matches("[A-Za-z0-9_-]{1,40}")) Net.postJson("/api/calls/" + call + "/decline", "{}");
                          }
                      } catch (Exception ignored) {
                      } finally {
                          pr.finish();
                      }
                  }).start();
              }
          }
          TSEOF
          mkdir -p "$(dirname "app/src/main/java/com/topsstudio/messenger/BootReceiver.java")"
          cat > app/src/main/java/com/topsstudio/messenger/BootReceiver.java <<'TSEOF'
          package com.topsstudio.messenger;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          /** После перезагрузки телефона и после обновления приложения — снова включить фоновое подключение. */
          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent i) {
                  String a = i.getAction();
                  if (Intent.ACTION_BOOT_COMPLETED.equals(a) || Intent.ACTION_MY_PACKAGE_REPLACED.equals(a)) {
                      PushService.startIfNeeded(c.getApplicationContext());
                  }
              }
          }
          TSEOF
          mkdir -p "$(dirname "app/src/main/java/com/topsstudio/messenger/Bridge.java")"
          cat > app/src/main/java/com/topsstudio/messenger/Bridge.java <<'TSEOF'
          package com.topsstudio.messenger;

          import android.net.Uri;
          import android.os.Build;
          import android.webkit.JavascriptInterface;

          import org.json.JSONObject;

          /**
           * window.TSAppNative — то, что сайт может попросить у приложения.
           * Каждый вызов работает только со страниц самого мессенджера (m.topsstudio.com).
           */
          final class Bridge {
              private final MainActivity a;

              Bridge(MainActivity a) { this.a = a; }

              private boolean ok() { return a.onMainSite(); }

              private void ui(Runnable r) { a.runOnUiThread(r); }

              @JavascriptInterface
              public String info() {
                  if (!ok()) return "{}";
                  try {
                      return new JSONObject()
                              .put("version", BuildConfig.VERSION_NAME)
                              .put("code", BuildConfig.VERSION_CODE)
                              .put("android", Build.VERSION.SDK_INT)
                              .put("background", Prefs.background(a))
                              .put("showText", Prefs.showText(a))
                              .put("enabled", Prefs.enabled(a))
                              .put("batteryExempt", a.batteryExempt())
                              .put("notif", a.notifState())
                              .put("push", PushService.running)
                              .toString();
                  } catch (Exception e) { return "{}"; }
              }

              @JavascriptInterface public String notifState() { return ok() ? a.notifState() : "denied"; }

              @JavascriptInterface public void requestNotifications() { if (ok()) ui(a::requestNotifications); }

              @JavascriptInterface public void openNotificationSettings() { if (ok()) ui(a::openNotificationSettings); }

              @JavascriptInterface public void requestBatteryExemption() { if (ok()) ui(a::requestBatteryExemption); }

              /** Уведомление от сайта — только если фоновое подключение не работает (иначе было бы два одинаковых). */
              @JavascriptInterface
              public void notify(String json) {
                  if (!ok() || PushService.running || MainActivity.visible) return;
                  try {
                      JSONObject o = new JSONObject(json);
                      Notifier.simple(a, o.optString("title", "TS Messenger"), o.optString("body", ""), o.optInt("chat"));
                  } catch (Exception ignored) { }
              }

              @JavascriptInterface
              public void setEnabled(boolean v) {
                  if (!ok()) return;
                  Prefs.setEnabled(a, v);
                  if (v) PushService.startIfNeeded(a); else { PushService.stop(a); Notifier.clearMessages(a); }
              }

              @JavascriptInterface
              public void setBackground(boolean v) {
                  if (!ok()) return;
                  Prefs.setBackground(a, v);
                  if (v) PushService.startIfNeeded(a); else PushService.stop(a);
              }

              @JavascriptInterface public void setShowText(boolean v) { if (ok()) Prefs.setShowText(a, v); }

              @JavascriptInterface public void pageReady(boolean notifPref) { if (ok()) a.onPageReady(notifPref); }

              @JavascriptInterface public void sessionChanged() { if (ok()) a.sessionChanged(); }

              @JavascriptInterface public void checkUpdate(boolean manual) { if (ok()) Updater.check(a, manual, a::emit); }

              @JavascriptInterface public void installUpdate() { if (ok()) ui(() -> Updater.install(a, a::emit)); }

              @JavascriptInterface public void callState(boolean active, boolean video) { if (ok()) ui(() -> a.callState(active, video)); }

              @JavascriptInterface public void setSpeaker(boolean on) { if (ok()) ui(() -> a.setSpeaker(on)); }

              @JavascriptInterface public boolean isSpeaker() { return ok() && a.isSpeaker(); }

              @JavascriptInterface public void setTheme(String hex, boolean light) { if (ok() && hex != null && hex.matches("#[0-9a-fA-F]{6}")) ui(() -> a.setTheme(hex, light)); }

              @JavascriptInterface
              public void openExternal(String url) {
                  if (!ok() || url == null) return;
                  Uri u = Uri.parse(url);
                  if ("https".equals(u.getScheme()) || "http".equals(u.getScheme())) {
                      ui(() -> { try { a.startActivity(new android.content.Intent(android.content.Intent.ACTION_VIEW, u)); } catch (Exception ignored) { } });
                  }
              }
          }
          TSEOF
          mkdir -p "$(dirname "app/src/main/java/com/topsstudio/messenger/InstallReceiver.java")"
          cat > app/src/main/java/com/topsstudio/messenger/InstallReceiver.java <<'TSEOF'
          package com.topsstudio.messenger;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageInstaller;
          import android.widget.Toast;

          /** Ответ системы на установку обновления: показать окно подтверждения или сообщить об ошибке. */
          public class InstallReceiver extends BroadcastReceiver {
              @Override
              @SuppressWarnings("deprecation")
              public void onReceive(Context c, Intent i) {
                  int st = i.getIntExtra(PackageInstaller.EXTRA_STATUS, PackageInstaller.STATUS_FAILURE);
                  if (st == PackageInstaller.STATUS_PENDING_USER_ACTION) {
                      Intent confirm = i.getParcelableExtra(Intent.EXTRA_INTENT);
                      if (confirm != null) {
                          confirm.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          try { c.startActivity(confirm); } catch (Exception ignored) { }
                      }
                  } else if (st != PackageInstaller.STATUS_SUCCESS) {
                      String msg = i.getStringExtra(PackageInstaller.EXTRA_STATUS_MESSAGE);
                      if (st == PackageInstaller.STATUS_FAILURE_CONFLICT || st == PackageInstaller.STATUS_FAILURE_INCOMPATIBLE) {
                          msg = "подпись не совпадает — удалите приложение и установите заново с сайта";
                      }
                      if (st != PackageInstaller.STATUS_FAILURE_ABORTED) {
                          Toast.makeText(c, "Обновление не установлено: " + (msg == null ? "ошибка" : msg), Toast.LENGTH_LONG).show();
                      }
                  }
              }
          }
          TSEOF
          mkdir -p "$(dirname "app/src/main/java/com/topsstudio/messenger/MainActivity.java")"
          cat > app/src/main/java/com/topsstudio/messenger/MainActivity.java <<'TSEOF'
          package com.topsstudio.messenger;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.ActivityNotFoundException;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.media.AudioDeviceInfo;
          import android.media.AudioManager;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.PowerManager;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.PermissionRequest;
          import android.webkit.URLUtil;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.List;

          /** Главный экран: сайт мессенджера внутри приложения + мост к Android (уведомления, звонки, обновления). */
          public class MainActivity extends Activity {
              static volatile boolean visible;

              private static final int REQ_FILE = 1, REQ_MEDIA = 2, REQ_NOTIF = 3, REQ_STORAGE = 4;

              WebView web;
              private FrameLayout root;
              private View customView;
              private WebChromeClient.CustomViewCallback customCb;
              private ValueCallback<Uri[]> fileCb;
              private PermissionRequest pendingPerm;
              private String[] pendingDownload;
              private boolean offline;
              volatile boolean pageReady;
              volatile String curUrl = "";
              private AudioManager am;
              private PowerManager.WakeLock proximity;
              private boolean inCall, speaker;
              private ConnectivityManager.NetworkCallback netCb;

              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  Notifier.channels(this);
                  am = (AudioManager) getSystemService(AUDIO_SERVICE);

                  root = new FrameLayout(this);
                  root.setBackgroundColor(Color.parseColor("#0b1530"));
                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#0b1530"));
                  root.addView(web, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(root);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setTextZoom(100);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  s.setJavaScriptCanOpenWindowsAutomatically(false);
                  s.setSupportMultipleWindows(false);
                  // сайт узнаёт, что он внутри приложения (и по объекту window.TSAppNative)
                  s.setUserAgentString(s.getUserAgentString() + " " + Net.UA);
                  WebView.setWebContentsDebuggingEnabled(BuildConfig.DEBUG);

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(web, false);

                  web.addJavascriptInterface(new Bridge(this), "TSAppNative");
                  web.setWebViewClient(new Client());
                  web.setWebChromeClient(new Chrome());
                  web.setDownloadListener((url, ua, cd, mime, len) -> download(url, cd, mime));

                  watchNetwork();
                  web.loadUrl(startUrl(getIntent()));
              }

              /* ---------------- адреса и переходы ---------------- */

              private String startUrl(Intent i) {
                  Uri d = i != null ? i.getData() : null;
                  if (d != null && "https".equals(d.getScheme()) && Net.HOST.equals(d.getHost())) return d.toString();
                  int chat = i != null ? i.getIntExtra("chat", 0) : 0;
                  return Net.SITE + "/" + (chat > 0 ? "#chat=" + chat : "");
              }

              @Override
              protected void onNewIntent(Intent i) {
                  super.onNewIntent(i);
                  setIntent(i);
                  Uri d = i.getData();
                  int chat = i.getIntExtra("chat", 0);
                  if (i.getStringExtra("call") != null) showOverLock(true);
                  if (d != null && "https".equals(d.getScheme()) && Net.HOST.equals(d.getHost())) {
                      web.loadUrl(d.toString());
                  } else if (chat > 0) {
                      if (pageReady) web.evaluateJavascript("window.TSAppOpenChat&&TSAppOpenChat(" + chat + ")", null);
                      else web.loadUrl(startUrl(i));
                  }
              }

              /** Входящий звонок: показать приложение поверх экрана блокировки. */
              private void showOverLock(boolean on) {
                  if (Build.VERSION.SDK_INT >= 27) { setShowWhenLocked(on); setTurnScreenOn(on); }
                  else {
                      int f = WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON;
                      if (on) getWindow().addFlags(f); else getWindow().clearFlags(f);
                  }
              }

              boolean onMainSite() {
                  Uri u = Uri.parse(curUrl == null ? "" : curUrl);
                  return "https".equals(u.getScheme()) && Net.HOST.equals(u.getHost());
              }

              private void openExternal(Uri u) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, u).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                  } catch (ActivityNotFoundException e) {
                      Toast.makeText(this, "Нет приложения, чтобы открыть ссылку", Toast.LENGTH_SHORT).show();
                  }
              }

              private class Client extends WebViewClient {
                  @Override
                  public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                      Uri u = r.getUrl();
                      String sc = u.getScheme() == null ? "" : u.getScheme();
                      if (("https".equals(sc)) && Net.ourHost(u.getHost())) return false;     // наш сайт — внутри приложения
                      if ("http".equals(sc) || "https".equals(sc) || "mailto".equals(sc) || "tel".equals(sc)) openExternal(u);
                      return true;                                                               // всё прочее — не открываем
                  }

                  @Override
                  public void onPageStarted(WebView v, String url, Bitmap fav) {
                      curUrl = url;
                      pageReady = false;
                  }

                  @Override
                  public void doUpdateVisitedHistory(WebView v, String url, boolean reload) { curUrl = url; }

                  @Override
                  public void onPageFinished(WebView v, String url) {
                      curUrl = url;
                      CookieManager.getInstance().flush();
                  }

                  @Override
                  public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                      if (r.isForMainFrame()) showOffline();
                  }
              }

              /* ---------------- нет сети ---------------- */

              private void showOffline() {
                  offline = true;
                  String html = "<!DOCTYPE html><html><head><meta name=viewport content='width=device-width,initial-scale=1'><style>"
                          + "body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1530;color:#fff;"
                          + "font:16px system-ui,sans-serif;text-align:center}.b{margin-top:22px;padding:13px 26px;border:0;border-radius:14px;"
                          + "background:linear-gradient(135deg,#7c8cff,#ff7ab6);color:#fff;font:inherit;font-weight:bold}"
                          + ".i{width:84px;height:84px;margin:0 auto 18px;border-radius:26px;display:flex;align-items:center;justify-content:center;"
                          + "background:rgba(255,255,255,.08);font-size:40px;animation:p 2s ease-in-out infinite}@keyframes p{50%{transform:scale(1.07)}}"
                          + "</style></head><body><div><div class=i>📡</div><h2 style='margin:0 0 8px'>Нет подключения</h2>"
                          + "<div style='opacity:.7;line-height:1.5'>Проверьте интернет — мессенджер<br>откроется сам, когда сеть появится.</div>"
                          + "<button class=b onclick=\"location.href='" + Net.SITE + "/'\">Повторить</button></div></body></html>";
                  web.loadDataWithBaseURL(null, html, "text/html", "utf-8", null);
              }

              private void watchNetwork() {
                  ConnectivityManager cm = (ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE);
                  netCb = new ConnectivityManager.NetworkCallback() {
                      @Override public void onAvailable(Network n) {
                          runOnUiThread(() -> { if (offline) { offline = false; web.loadUrl(Net.SITE + "/"); } });
                      }
                  };
                  try { cm.registerDefaultNetworkCallback(netCb); } catch (Exception ignored) { }
              }

              /* ---------------- камера, микрофон, файлы, видео на весь экран ---------------- */

              private class Chrome extends WebChromeClient {
                  @Override
                  public void onPermissionRequest(PermissionRequest r) {
                      runOnUiThread(() -> {
                          Uri o = r.getOrigin();
                          if (o == null || !Net.HOST.equals(o.getHost())) { r.deny(); return; }
                          List<String> need = new ArrayList<>();
                          for (String res : r.getResources()) {
                              if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(res)) need.add(Manifest.permission.RECORD_AUDIO);
                              else if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(res)) need.add(Manifest.permission.CAMERA);
                          }
                          if (need.isEmpty()) { r.deny(); return; }
                          List<String> missing = new ArrayList<>();
                          for (String p : need) if (checkSelfPermission(p) != PackageManager.PERMISSION_GRANTED) missing.add(p);
                          if (missing.isEmpty()) { grantMedia(r); return; }
                          if (pendingPerm != null) pendingPerm.deny();
                          pendingPerm = r;
                          requestPermissions(missing.toArray(new String[0]), REQ_MEDIA);
                      });
                  }

                  @Override
                  public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                      if (fileCb != null) fileCb.onReceiveValue(null);
                      fileCb = cb;
                      Intent i = p.createIntent();
                      if (p.getMode() == FileChooserParams.MODE_OPEN_MULTIPLE) i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                      try {
                          startActivityForResult(Intent.createChooser(i, "Выберите файл"), REQ_FILE);
                      } catch (ActivityNotFoundException e) {
                          fileCb = null;
                          return false;
                      }
                      return true;
                  }

                  @Override
                  public void onShowCustomView(View view, CustomViewCallback cb) {
                      if (customView != null) { cb.onCustomViewHidden(); return; }
                      customView = view;
                      customCb = cb;
                      root.addView(view, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                      web.setVisibility(View.GONE);
                      immersive(true);
                  }

                  @Override
                  public void onHideCustomView() {
                      if (customView == null) return;
                      root.removeView(customView);
                      customView = null;
                      web.setVisibility(View.VISIBLE);
                      immersive(false);
                      if (customCb != null) customCb.onCustomViewHidden();
                      customCb = null;
                  }

                  @Override
                  public Bitmap getDefaultVideoPoster() {
                      return Bitmap.createBitmap(1, 1, Bitmap.Config.ARGB_8888);      // без серого значка «play» до загрузки видео
                  }
              }

              private void grantMedia(PermissionRequest r) {
                  List<String> ok = new ArrayList<>();
                  for (String res : r.getResources()) {
                      if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(res) && checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) ok.add(res);
                      if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(res) && checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) ok.add(res);
                  }
                  if (ok.isEmpty()) r.deny(); else r.grant(ok.toArray(new String[0]));
              }

              @SuppressWarnings("deprecation")
              private void immersive(boolean on) {
                  View d = getWindow().getDecorView();
                  d.setSystemUiVisibility(on ? (View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY) : 0);
                  if (!on) applyBars();
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req != REQ_FILE || fileCb == null) return;
                  Uri[] out = null;
                  if (res == RESULT_OK && data != null) {
                      if (data.getClipData() != null) {
                          int n = data.getClipData().getItemCount();
                          out = new Uri[n];
                          for (int i = 0; i < n; i++) out[i] = data.getClipData().getItemAt(i).getUri();
                      } else if (data.getData() != null) {
                          out = new Uri[]{data.getData()};
                      }
                  }
                  fileCb.onReceiveValue(out);
                  fileCb = null;
              }

              @Override
              public void onRequestPermissionsResult(int req, String[] perms, int[] res) {
                  super.onRequestPermissionsResult(req, perms, res);
                  if (req == REQ_MEDIA && pendingPerm != null) {
                      grantMedia(pendingPerm);
                      pendingPerm = null;
                  } else if (req == REQ_NOTIF) {
                      Prefs.setNotifAsked(this);
                      emit("notif", "state", notifState());
                      if (Notifier.enabled(this)) PushService.startIfNeeded(this);
                  } else if (req == REQ_STORAGE && pendingDownload != null) {
                      String[] d = pendingDownload;
                      pendingDownload = null;
                      if (res.length > 0 && res[0] == PackageManager.PERMISSION_GRANTED) download(d[0], d[1], d[2]);
                  }
              }

              /* ---------------- скачивание файлов ---------------- */

              private void download(String url, String cd, String mime) {
                  Uri u = Uri.parse(url);
                  if (!"https".equals(u.getScheme()) || !Net.ourHost(u.getHost())) { openExternal(u); return; }
                  if (Build.VERSION.SDK_INT < 29 && checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                      pendingDownload = new String[]{url, cd, mime};
                      requestPermissions(new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE}, REQ_STORAGE);
                      return;
                  }
                  String name = URLUtil.guessFileName(url, cd, mime);
                  try {
                      DownloadManager.Request r = new DownloadManager.Request(u)
                              .addRequestHeader("Cookie", CookieManager.getInstance().getCookie(url))
                              .addRequestHeader("User-Agent", web.getSettings().getUserAgentString())
                              .setTitle(name)
                              .setMimeType(mime)
                              .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                              .setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name);
                      ((DownloadManager) getSystemService(DOWNLOAD_SERVICE)).enqueue(r);
                      Toast.makeText(this, "Скачивается: " + name, Toast.LENGTH_SHORT).show();
                  } catch (Exception e) {
                      Toast.makeText(this, "Не удалось скачать файл", Toast.LENGTH_SHORT).show();
                  }
              }

              /* ---------------- жизненный цикл ---------------- */

              @Override
              protected void onResume() {
                  super.onResume();
                  visible = true;
                  Notifier.clearMessages(this);
                  if (Updater.waitingPermission && Build.VERSION.SDK_INT >= 26 && getPackageManager().canRequestPackageInstalls()) {
                      Updater.install(this, this::emit);
                  }
                  if (pageReady) emit("resume", "x", "1");
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  visible = false;
                  CookieManager.getInstance().flush();
                  if (!inCall) showOverLock(false);
              }

              @Override
              protected void onDestroy() {
                  try { ((ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE)).unregisterNetworkCallback(netCb); } catch (Exception ignored) { }
                  callState(false, false);
                  if (web != null) { root.removeView(web); web.destroy(); }
                  super.onDestroy();
              }

              @SuppressWarnings("deprecation")
              @Override
              public void onBackPressed() {
                  if (customView != null) { new Chrome().onHideCustomView(); return; }
                  web.evaluateJavascript("(window.TSAppBack&&TSAppBack())===true", v -> {
                      if ("true".equals(v)) return;
                      if (web.canGoBack() && !offline) web.goBack();
                      else moveTaskToBack(true);
                  });
              }

              /* ---------------- вызовы из моста ---------------- */

              /** Событие для сайта: window.__tsApp({t: ...}). */
              void emit(JSONObject ev) {
                  runOnUiThread(() -> { if (web != null && onMainSite()) web.evaluateJavascript("window.__tsApp&&__tsApp(" + ev + ")", null); });
              }

              void emit(String t, String k, Object v) {
                  try { emit(new JSONObject().put("t", t).put(k, v)); } catch (Exception ignored) { }
              }

              String notifState() {
                  if (Notifier.enabled(this)) return "granted";
                  if (Build.VERSION.SDK_INT >= 33) {
                      if (!Prefs.notifAsked(this) || shouldShowRequestPermissionRationale(Manifest.permission.POST_NOTIFICATIONS)) return "default";
                  }
                  return "denied";
              }

              void requestNotifications() {
                  if (Notifier.enabled(this)) { emit("notif", "state", "granted"); return; }
                  if (Build.VERSION.SDK_INT >= 33 && !"denied".equals(notifState())) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, REQ_NOTIF);
                  } else {
                      openNotificationSettings();
                      emit("notif", "state", notifState());
                  }
              }

              void openNotificationSettings() {
                  Intent i;
                  if (Build.VERSION.SDK_INT >= 26) {
                      i = new Intent(android.provider.Settings.ACTION_APP_NOTIFICATION_SETTINGS).putExtra(android.provider.Settings.EXTRA_APP_PACKAGE, getPackageName());
                  } else {
                      i = new Intent(android.provider.Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + getPackageName()));
                  }
                  try { startActivity(i); } catch (Exception ignored) { }
              }

              boolean batteryExempt() {
                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  return pm.isIgnoringBatteryOptimizations(getPackageName());
              }

              @SuppressLint("BatteryLife")
              void requestBatteryExemption() {
                  try {
                      startActivity(new Intent(android.provider.Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + getPackageName())));
                  } catch (Exception e) {
                      try { startActivity(new Intent(android.provider.Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS)); } catch (Exception ignored) { }
                  }
              }

              /* ---------------- звонок: режим разговора, динамик, экран ---------------- */

              @SuppressWarnings("deprecation")
              void callState(boolean active, boolean video) {
                  if (active == inCall) { if (active) setSpeaker(video || speaker); return; }
                  inCall = active;
                  if (active) {
                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      am.setMode(AudioManager.MODE_IN_COMMUNICATION);
                      setSpeaker(video);
                  } else {
                      getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      if (Build.VERSION.SDK_INT >= 31) am.clearCommunicationDevice(); else am.setSpeakerphoneOn(false);
                      am.setMode(AudioManager.MODE_NORMAL);
                      speaker = false;
                      proximity(false);
                      showOverLock(false);
                  }
              }

              @SuppressWarnings("deprecation")
              void setSpeaker(boolean on) {
                  speaker = on;
                  if (Build.VERSION.SDK_INT >= 31) {
                      AudioDeviceInfo pick = null;
                      for (AudioDeviceInfo d : am.getAvailableCommunicationDevices()) {
                          int t = d.getType();
                          if (on && t == AudioDeviceInfo.TYPE_BUILTIN_SPEAKER) pick = d;
                          if (!on && (t == AudioDeviceInfo.TYPE_WIRED_HEADSET || t == AudioDeviceInfo.TYPE_WIRED_HEADPHONES
                                  || t == AudioDeviceInfo.TYPE_BLUETOOTH_SCO || t == AudioDeviceInfo.TYPE_BLE_HEADSET || t == AudioDeviceInfo.TYPE_USB_HEADSET)) pick = d;
                      }
                      if (!on && pick == null) {
                          for (AudioDeviceInfo d : am.getAvailableCommunicationDevices()) if (d.getType() == AudioDeviceInfo.TYPE_BUILTIN_EARPIECE) pick = d;
                      }
                      if (pick != null) am.setCommunicationDevice(pick); else am.clearCommunicationDevice();
                  } else {
                      am.setSpeakerphoneOn(on);
                  }
                  proximity(inCall && !on);
              }

              boolean isSpeaker() { return speaker; }

              /** Во время разговора у уха экран гаснет (датчик приближения). */
              private void proximity(boolean on) {
                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  if (on) {
                      if (proximity == null && pm.isWakeLockLevelSupported(PowerManager.PROXIMITY_SCREEN_OFF_WAKE_LOCK)) {
                          proximity = pm.newWakeLock(PowerManager.PROXIMITY_SCREEN_OFF_WAKE_LOCK, "ts:proximity");
                      }
                      if (proximity != null && !proximity.isHeld()) proximity.acquire(4 * 60 * 60 * 1000L);
                  } else if (proximity != null && proximity.isHeld()) {
                      proximity.release();
                  }
              }

              /* ---------------- цвет системных панелей — как у сайта ---------------- */

              private int barColor = Color.parseColor("#0f0f12");
              private boolean barLight;

              void setTheme(String hex, boolean light) {
                  try { barColor = Color.parseColor(hex); } catch (Exception e) { return; }
                  barLight = light;
                  applyBars();
              }

              @SuppressWarnings("deprecation")
              private void applyBars() {
                  Window w = getWindow();
                  w.setStatusBarColor(barColor);
                  w.setNavigationBarColor(barColor);
                  int f = 0;
                  if (barLight) {
                      f |= View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
                      if (Build.VERSION.SDK_INT >= 26) f |= View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;
                  }
                  w.getDecorView().setSystemUiVisibility(f);
                  root.setBackgroundColor(barColor);
              }

              /* ---------------- готовность страницы ---------------- */

              void onPageReady(boolean notifPref) {
                  pageReady = true;
                  Prefs.setLoggedIn(this, true);
                  Prefs.setEnabled(this, notifPref);
                  PushService.kick(this);
                  Intent i = getIntent();
                  if (i != null && i.getIntExtra("chat", 0) > 0) {
                      int chat = i.getIntExtra("chat", 0);
                      i.removeExtra("chat");
                      runOnUiThread(() -> web.evaluateJavascript("window.TSAppOpenChat&&TSAppOpenChat(" + chat + ")", null));
                  }
                  // обновления — не чаще раза в 6 часов, тихо (окно покажет сайт)
                  if (System.currentTimeMillis() - Prefs.lastUpdateCheck(this) > 6 * 3600 * 1000L) {
                      Updater.check(this, false, this::emit);
                  }
              }

              void sessionChanged() {
                  Prefs.setLoggedIn(this, false);
                  PushService.stop(this);
                  Notifier.clearMessages(this);
              }

              static boolean has(Context c, String perm) {
                  return c.checkSelfPermission(perm) == PackageManager.PERMISSION_GRANTED;
              }
          }
          TSEOF
          mkdir -p "$(dirname "app/src/main/java/com/topsstudio/messenger/Net.java")"
          cat > app/src/main/java/com/topsstudio/messenger/Net.java <<'TSEOF'
          package com.topsstudio.messenger;

          import android.net.Uri;
          import android.webkit.CookieManager;

          import java.util.concurrent.TimeUnit;

          import okhttp3.MediaType;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.RequestBody;
          import okhttp3.Response;

          /** Запросы к серверу мессенджера от имени вошедшего пользователя (cookie из WebView). */
          final class Net {
              private Net() { }

              static final String SITE = BuildConfig.SITE;
              static final String HOST = Uri.parse(SITE).getHost();
              static final String UA = "TSMessengerApp/" + BuildConfig.VERSION_NAME + " (Android)";

              private static OkHttpClient client;

              static synchronized OkHttpClient http() {
                  if (client == null) {
                      client = new OkHttpClient.Builder()
                              .connectTimeout(15, TimeUnit.SECONDS)
                              .readTimeout(30, TimeUnit.SECONDS)
                              .pingInterval(30, TimeUnit.SECONDS)
                              .build();
                  }
                  return client;
              }

              static String cookie() {
                  try { return CookieManager.getInstance().getCookie(SITE); } catch (Throwable e) { return null; }
              }

              /** Есть ли сессия (cookie msid). */
              static boolean hasSession() {
                  String c = cookie();
                  return c != null && c.contains("msid=");
              }

              /** Только наш сайт и его поддомены (m., voicem., adminm.). */
              static boolean ourHost(String host) {
                  if (host == null) return false;
                  String root = HOST.contains(".") ? HOST.substring(HOST.indexOf('.') + 1) : HOST;
                  return host.equals(HOST) || host.equals(root) || host.endsWith("." + root);
              }

              /** POST JSON к API (те же заголовки, что у сайта: защита от подделки запросов). */
              static int postJson(String path, String json) {
                  String c = cookie();
                  if (c == null) return 401;
                  Request r = new Request.Builder()
                          .url(SITE + path)
                          .header("Cookie", c)
                          .header("Origin", SITE)
                          .header("X-Requested-With", "ts")
                          .header("User-Agent", UA)
                          .post(RequestBody.create(json, MediaType.get("application/json; charset=utf-8")))
                          .build();
                  try (Response resp = http().newCall(r).execute()) {
                      return resp.code();
                  } catch (Exception e) {
                      return -1;
                  }
              }
          }
