          import okhttp3.Response;

          /**
           * Обновление через GitHub: последний релиз репозитория, файл ts-messenger.apk.
           * Номер версии — в названии релиза (v123 = versionCode 123). Ставится поверх, данные не теряются.
           */
          final class Updater {
              private Updater() { }

              interface Cb { void event(JSONObject ev); }

              static final String ASSET = "ts-messenger.apk";
              private static JSONObject latest;            // {code, version, url, size, notes}
              static volatile boolean waitingPermission;
              private static volatile boolean busy;

              private static JSONObject ev(String t) {
                  JSONObject o = new JSONObject();
                  try { o.put("t", t); } catch (Exception ignored) { }
                  return o;
              }

              /** Проверить новую версию. manual — человек сам нажал «Проверить» (сообщаем и «у вас последняя»). */
              static void check(Context c, boolean manual, Cb cb) {
                  new Thread(() -> {
                      try {
                          Request r = new Request.Builder()
                                  .url("https://api.github.com/repos/" + BuildConfig.REPO + "/releases/latest")
                                  .header("Accept", "application/vnd.github+json")
                                  .header("User-Agent", Net.UA)
                                  .build();
                          try (Response resp = Net.http().newCall(r).execute()) {
                              if (resp.code() == 404) throw new Exception("Релизов пока нет (или репозиторий закрытый)");
                              if (!resp.isSuccessful()) throw new Exception("GitHub ответил " + resp.code());
                              JSONObject j = new JSONObject(resp.body().string());
                              Matcher m = Pattern.compile("(\\d+)").matcher(j.optString("tag_name", ""));
                              int code = m.find() ? Integer.parseInt(m.group(1)) : 0;
                              String url = null;
                              long size = 0;
                              JSONArray as = j.optJSONArray("assets");
                              for (int i = 0; as != null && i < as.length(); i++) {
                                  JSONObject a = as.getJSONObject(i);
                                  if (ASSET.equals(a.optString("name"))) { url = a.optString("browser_download_url"); size = a.optLong("size"); }
                              }
                              Prefs.setLastUpdateCheck(c, System.currentTimeMillis());
                              if (code > BuildConfig.VERSION_CODE && url != null && url.startsWith("https://github.com/")) {
                                  latest = new JSONObject().put("code", code).put("version", "1.0." + code)
                                          .put("url", url).put("size", size).put("notes", j.optString("body", ""));
                                  JSONObject e = ev("update");
                                  e.put("version", "1.0." + code).put("size", size).put("notes", j.optString("body", "")).put("silent", !manual);
                                  cb.event(e);
                              } else if (manual) {
                                  cb.event(ev("no_update"));
                              }
                          }
                      } catch (Exception e) {
                          if (manual) {
                              JSONObject o = ev("update_error");
                              try { o.put("error", "Не удалось проверить: " + e.getMessage()); } catch (Exception ignored) { }
                              cb.event(o);
                          }
                      }
                  }).start();
              }

              /** Скачать и установить. Нужен разрешённый «Установка неизвестных приложений» для этого приложения. */
              static void install(Activity a, Cb cb) {
                  if (busy) return;
                  if (latest == null) {
                      check(a, true, e -> { if ("update".equals(e.optString("t"))) a.runOnUiThread(() -> install(a, cb)); else cb.event(e); });
                      return;
                  }
                  if (Build.VERSION.SDK_INT >= 26 && !a.getPackageManager().canRequestPackageInstalls()) {
                      waitingPermission = true;
                      cb.event(ev("update_perm"));
                      Intent i = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + a.getPackageName()));
                      try { a.startActivity(i); } catch (Exception ignored) { }
                      return;
                  }
                  waitingPermission = false;
                  busy = true;
                  final JSONObject L = latest;
                  new Thread(() -> {
                      File f = new File(a.getCacheDir(), "update.apk");
                      try {
                          Request r = new Request.Builder().url(L.getString("url")).header("User-Agent", Net.UA).build();
                          try (Response resp = Net.http().newCall(r).execute()) {
                              if (!resp.isSuccessful()) throw new Exception("скачивание: " + resp.code());
                              long total = resp.body().contentLength();
                              if (total <= 0) total = L.optLong("size");
                              try (InputStream in = resp.body().byteStream(); OutputStream out = new FileOutputStream(f)) {
                                  byte[] buf = new byte[64 * 1024];
                                  long done = 0, lastSent = 0;
                                  int n;
                                  while ((n = in.read(buf)) > 0) {
                                      out.write(buf, 0, n);
                                      done += n;
                                      if (total > 0 && done - lastSent > total / 50) {
                                          lastSent = done;
                                          JSONObject p = ev("update_progress");
                                          p.put("p", Math.min(1.0, (double) done / total));
                                          cb.event(p);
                                      }
                                  }
                              }
                          }
                          // проверяем, что это наше приложение и оно новее (подпись проверит сам Android)
                          PackageInfo pi = a.getPackageManager().getPackageArchiveInfo(f.getAbsolutePath(), 0);
                          if (pi == null || !a.getPackageName().equals(pi.packageName)) throw new Exception("файл повреждён");
                          long code = Build.VERSION.SDK_INT >= 28 ? pi.getLongVersionCode() : pi.versionCode;
                          if (code <= BuildConfig.VERSION_CODE) throw new Exception("это не новая версия");

                          PackageInstaller pkg = a.getPackageManager().getPackageInstaller();
                          PackageInstaller.SessionParams sp = new PackageInstaller.SessionParams(PackageInstaller.SessionParams.MODE_FULL_INSTALL);
                          sp.setAppPackageName(a.getPackageName());
                          if (Build.VERSION.SDK_INT >= 31) sp.setRequireUserAction(PackageInstaller.SessionParams.USER_ACTION_NOT_REQUIRED);
                          int sid = pkg.createSession(sp);
                          try (PackageInstaller.Session s = pkg.openSession(sid)) {
                              try (InputStream in = new FileInputStream(f); OutputStream out = s.openWrite("app.apk", 0, f.length())) {
                                  byte[] buf = new byte[64 * 1024];
                                  int n;
                                  while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                                  s.fsync(out);
                              }
                              Intent done = new Intent(a, InstallReceiver.class).setAction("ts.installed");
                              PendingIntent pi2 = PendingIntent.getBroadcast(a, sid, done, Notifier.piFlags(true));
                              s.commit(pi2.getIntentSender());
                          }
                          cb.event(ev("update_ready"));
                      } catch (Exception e) {
                          JSONObject o = ev("update_error");
                          try { o.put("error", "Не удалось обновить: " + e.getMessage()); } catch (Exception ignored) { }
                          cb.event(o);
                          //noinspection ResultOfMethodCallIgnored
                          f.delete();
                      } finally {
                          busy = false;
                      }
                  }).start();
              }
          }
          TSEOF

      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > proj/app/release.jks

      - name: Собрать APK
        working-directory: proj
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          cp proj/app/build/outputs/apk/release/app-release.apk ts-messenger.apk
          [ -n "$NOTES" ] || NOTES="Обновление приложения"
          gh release create "v$VERSION_CODE" ts-messenger.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "TS Messenger 1.0.$VERSION_CODE" \
            --notes "$NOTES" \
            --latest
          echo "### Готово: TS Messenger 1.0.$VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "Скачать: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/ts-messenger.apk" >> "$GITHUB_STEP_SUMMARY"
