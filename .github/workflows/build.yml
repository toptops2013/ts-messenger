# Сборка приложения TS Messenger для Android.
# Весь проект приложения — внутри этого файла (шаг «Создать проект»): ничего больше загружать не нужно.
# Каждое изменение этого файла = новая версия: APK появляется в Releases, а установленное приложение
# само находит её и предлагает обновиться.
#
# Один раз нужно добавить секреты: Settings → Secrets and variables → Actions → New repository secret
#   KEYSTORE_B64      — ключ подписи (текст base64)
#   KEYSTORE_PASSWORD — пароль ключа
# Без одинакового ключа Android не даст установить обновление поверх старой версии.

name: Android APK

on:
  push:
    paths:
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      SITE_URL: https://m.topsstudio.com
    steps:
      - name: Проверить секреты
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Добавьте секреты KEYSTORE_B64 и KEYSTORE_PASSWORD: Settings → Secrets and variables → Actions"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Создать проект
        run: |
          mkdir -p proj && cd proj
          mkdir -p "$(dirname "build.gradle")"
          cat > build.gradle <<'TSEOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          TSEOF
          mkdir -p "$(dirname "gradle.properties")"
          cat > gradle.properties <<'TSEOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          android.useAndroidX=false
          TSEOF
          mkdir -p "$(dirname "settings.gradle")"
          cat > settings.gradle <<'TSEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "TSMessenger"
          include ':app'
          TSEOF
          mkdir -p "$(dirname "app/build.gradle")"
          cat > app/build.gradle <<'TSEOF'
          plugins {
              id 'com.android.application'
          }

          // Номер версии = номер сборки на GitHub (каждая сборка новее предыдущей — по нему приложение находит обновление)
          def vcode = (System.getenv("VERSION_CODE") ?: "1") as int
          def site = System.getenv("SITE_URL") ?: "https://m.topsstudio.com"
          def repo = System.getenv("GITHUB_REPOSITORY") ?: "toptops2013/ts-messenger"

          android {
              namespace 'com.topsstudio.messenger'
              compileSdk 34

              defaultConfig {
                  applicationId "com.topsstudio.messenger"
                  minSdk 24
                  targetSdk 34
                  versionCode vcode
                  versionName "1.0." + vcode
                  buildConfigField "String", "SITE", "\"" + site + "\""
                  buildConfigField "String", "REPO", "\"" + repo + "\""
              }

              buildFeatures { buildConfig true }

              signingConfigs {
                  release {
                      storeFile file("release.jks")
                      storePassword System.getenv("KS_PASS")
                      keyAlias "tsmessenger"
                      keyPassword System.getenv("KS_PASS")
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }

          dependencies {
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          TSEOF
          mkdir -p "$(dirname "app/src/main/AndroidManifest.xml")"
          cat > app/src/main/AndroidManifest.xml <<'TSEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_REMOTE_MESSAGING" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />

              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:hardwareAccelerated="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <!-- ссылки на мессенджер (и одноразовые ссылки входа) открываются в приложении -->
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="m.topsstudio.com" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".PushService"
                      android:exported="false"
                      android:foregroundServiceType="remoteMessaging" />

                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>
                  <receiver android:name=".ActionReceiver" android:exported="false" />
                  <receiver android:name=".InstallReceiver" android:exported="false" />
              </application>
          </manifest>
          TSEOF
          mkdir -p "$(dirname "app/src/main/res/drawable/ic_launcher_background.xml")"
          cat > app/src/main/res/drawable/ic_launcher_background.xml <<'TSEOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:angle="315" android:startColor="#7c8cff" android:endColor="#ff7ab6" />
          </shape>
          TSEOF
          mkdir -p "$(dirname "app/src/main/res/drawable/ic_launcher_foreground.xml")"
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'TSEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="512" android:viewportHeight="512">
              <group android:pivotX="256" android:pivotY="256" android:scaleX="0.62" android:scaleY="0.62">
                  <path android:pathData="M394,245a138,138 0,0 1,-148 138a141,141 0,0 1,-62 -15l-86,31 31,-85a138,138 0,1 1,265 -69z" android:strokeColor="#FFFFFFFF" android:strokeWidth="36"
                      android:strokeLineJoin="round" android:fillColor="#00000000" />
              </group>
          </vector>
          TSEOF
          mkdir -p "$(dirname "app/src/main/res/drawable/ic_launcher_round_bg.xml")"
          cat > app/src/main/res/drawable/ic_launcher_round_bg.xml <<'TSEOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <corners android:radius="22dp" />
              <gradient android:angle="315" android:startColor="#7c8cff" android:endColor="#ff7ab6" />
          </shape>
          TSEOF
          mkdir -p "$(dirname "app/src/main/res/drawable/ic_stat.xml")"
          cat > app/src/main/res/drawable/ic_stat.xml <<'TSEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="512" android:viewportHeight="512">
              <path android:pathData="M394,245a138,138 0,0 1,-148 138a141,141 0,0 1,-62 -15l-86,31 31,-85a138,138 0,1 1,265 -69z" android:strokeColor="#FFFFFFFF" android:strokeWidth="44"
                  android:strokeLineJoin="round" android:fillColor="#00000000" />
          </vector>
          TSEOF
          mkdir -p "$(dirname "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml")"
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'TSEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
              <monochrome android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          TSEOF
          mkdir -p "$(dirname "app/src/main/res/mipmap/ic_launcher.xml")"
          cat > app/src/main/res/mipmap/ic_launcher.xml <<'TSEOF'
          <?xml version="1.0" encoding="utf-8"?>
